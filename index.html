<!DOCTYPE html>
<html>
<head>
  <title>Jeremy's Soccer Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Maryland Soccer Calendar</h1>
<h2>Upcoming Maryland Soccer Matches</h2>
<p>Next 7 days</p>

  <label for="competitionFilter">Competition:</label>

<select id="competitionFilter">
    <option value="All">All</option>
    <option value="NCAA D1 Men">NCAA D1 Men</option>
    <option value="NCAA D1 Women">NCAA D1 Women</option>
</select>

  <label for="timeFilter">Show:</label>

<select id="timeFilter">
    <option value="7">Next 7 days</option>
    <option value="30">Next 30 days</option>
    <option value="all">All future games</option>
</select>

<div id="matches">
  Loading matches...
</div>

<script src="app.js"></script>

</body>
</html>
